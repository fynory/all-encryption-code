#!/usr/sbin/nft -f
# nftables fragment for an ALL tunnel node (the design plan, section 5). It protects the PROCESS, not the product: the node decides who may
# have what (tunnel/limits.go), and these limits sit above its own on purpose, so that the kernel refuses only what the node would never have served:
#
#   per source (an IPv4 address, or an IPv6 /64, as the node counts them)
#     connections held        1024  the node's cap is node_limits.per_ip_concurrent (16), 8 times that for an address of the OpenAI list or of a device.
#                                   The kernel counts EVERY connection a source holds: a device's control connection plus one data connection per open
#                                   stream (up to node_limits.label_streams_max for each device behind one address), which the node stops counting when
#                                   they attach. 1024 is room for 16 devices at their cap behind one NAT
#     new connections         200/s the node's is node_limits.per_ip_new_per_s (10), 8 times that for the OpenAI list or a device
#   whole node
#     new connections         20000/s and 40000 of burst: a flood the process could not read fast enough anyway
#   port 80 (the node's own ACME webroot and nothing else): 32 connections and 20 new a second per source
#
# nftables_test.go (TestNftables_*) checks that these numbers are never below the node's, so a retuned policy cannot leave the kernel stricter than the
# node. The file only ADDS drops: its chain accepts by default, so loading it cannot lock the operator out. SYN cookies are a sysctl, not an nftables
# rule: install deploy/sysctl.conf next to this file.
#
# Check it before loading it:   nft -c -f /etc/nftables.d/all-tunnel.conf
# Load it with the system's own nftables service (include it from /etc/nftables.conf), never with a script of the node: the node holds no privilege.
#
# NOTE: written against nftables 1.0 (Ubuntu 24.04). It has been read, not run: the first deployment runs the check above and fixes what it says.

# Loading the file twice must not stack its rules: the table is dropped and made again (the first line makes sure it exists, so the delete never fails).
table inet all_tunnel
delete table inet all_tunnel

table inet all_tunnel {
	# connections held per source, counted by the kernel's conntrack
	set held4 { type ipv4_addr; flags dynamic; size 65536; }
	set held6 { type ipv6_addr; flags dynamic; size 65536; }
	# new connections per source and second
	set rate4 { type ipv4_addr; flags dynamic,timeout; timeout 1m; size 65536; }
	set rate6 { type ipv6_addr; flags dynamic,timeout; timeout 1m; size 65536; }
	set held80_4 { type ipv4_addr; flags dynamic; size 65536; }
	set held80_6 { type ipv6_addr; flags dynamic; size 65536; }
	set rate80_4 { type ipv4_addr; flags dynamic,timeout; timeout 1m; size 65536; }
	set rate80_6 { type ipv6_addr; flags dynamic,timeout; timeout 1m; size 65536; }

	chain input {
		type filter hook input priority filter - 10; policy accept;

		ct state invalid drop

		# the whole node: more new connections than the process can read is a flood, whoever sends it
		tcp dport { 80, 443 } ct state new limit rate over 20000/second burst 40000 packets drop

		# :443, per source
		tcp dport 443 ct state new add @held4 { ip saddr ct count over 1024 } drop
		tcp dport 443 ct state new add @held6 { ip6 saddr & ffff:ffff:ffff:ffff:: ct count over 1024 } drop
		tcp dport 443 ct state new add @rate4 { ip saddr limit rate over 200/second burst 400 packets } drop
		tcp dport 443 ct state new add @rate6 { ip6 saddr & ffff:ffff:ffff:ffff:: limit rate over 200/second burst 400 packets } drop

		# :80, per source
		tcp dport 80 ct state new add @held80_4 { ip saddr ct count over 32 } drop
		tcp dport 80 ct state new add @held80_6 { ip6 saddr & ffff:ffff:ffff:ffff:: ct count over 32 } drop
		tcp dport 80 ct state new add @rate80_4 { ip saddr limit rate over 20/second burst 40 packets } drop
		tcp dport 80 ct state new add @rate80_6 { ip6 saddr & ffff:ffff:ffff:ffff:: limit rate over 20/second burst 40 packets } drop
	}
}
