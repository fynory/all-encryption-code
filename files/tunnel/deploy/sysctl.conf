# Kernel settings for an ALL tunnel node (the design plan, section 5): install as /etc/sysctl.d/99-all-tunnel.conf, then `sysctl --system`.
#
# SYN cookies: a flood of half-open connections never fills the accept queue, and a client that completes the handshake still gets served.
net.ipv4.tcp_syncookies = 1
# the queues the node's listeners (Go's default backlog follows somaxconn) and the kernel's half-open table can hold
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192
# a connection the peer abandoned in FIN-WAIT is let go sooner (the node's own idle limits and TCP keepalive end the rest)
net.ipv4.tcp_fin_timeout = 20
# connection tracking must hold what nftables counts: the table is the size of the node's busiest day, with room
net.netfilter.nf_conntrack_max = 262144
