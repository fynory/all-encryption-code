# journald drop-in for an ALL tunnel node: /etc/systemd/journald.conf.d/all-tunnel.conf (the design plan, section 5, "Higiene de logs").
#
# The journal lives in memory only. The node's own log lines carry no address, no name and no label (tunnel/loghygiene_test.go), and this makes sure
# nothing else of the machine (sshd, the kernel, certbot) leaves a persistent trace either: a reboot or a rebuild starts with an empty journal.
# What stays is bounded, so a flood cannot fill the disk or the RAM.
[Journal]
Storage=volatile
RuntimeMaxUse=64M
RuntimeMaxFileSize=8M
MaxRetentionSec=3day
ForwardToSyslog=no
ForwardToWall=no
